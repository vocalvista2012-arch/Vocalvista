<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SamAI | Imagine. Create.</title>

<meta name="description"
content="SamAI - AI Image Generator by VocalVista. Imagine. Create.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

<link rel="icon" href="icon-192.png" type="image/png">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #050816;
    color: white;
}

.samai-nav {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    background: rgba(10, 12, 30, 0.9);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
}

.samai-brand {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(90deg,#6c4cff,#a855f7,#4cc9ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.back-btn {
    text-decoration: none;
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    transition: 0.3s;
}

.back-btn:hover {
    background: rgba(108,76,255,0.3);
}

.samai-hero {
    min-height: calc(100vh - 75px);
    padding: 70px 20px;
    text-align: center;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
}

.samai-glow {
    position: absolute;
    width: 500px;
    height: 500px;
    background: #6c4cff;
    filter: blur(180px);
    opacity: 0.12;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
}

.samai-title {
    position: relative;
    font-size: 60px;
    font-weight: 800;
    margin: 20px 0 5px;

    background: linear-gradient(
        90deg,
        #6c4cff,
        #a855f7,
        #4cc9ff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.samai-subtitle {
    position: relative;
    font-size: 20px;
    color: #aaaec4;
    margin-bottom: 45px;
}

.generator {
    position: relative;
    max-width: 800px;
    margin: auto;
    padding: 30px;
    border-radius: 25px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        0 0 40px rgba(108,76,255,0.12);

    backdrop-filter: blur(20px);
}

#prompt {
    width: 100%;
    min-height: 150px;
    padding: 18px;
    box-sizing: border-box;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.35);
    color: white;
    font-family: inherit;
    font-size: 16px;
    resize: vertical;
    outline: none;
}

#prompt::placeholder {
    color: #777b91;
}

#prompt:focus {
    border-color: #765cff;

    box-shadow:
        0 0 20px rgba(108,76,255,0.25);
}

.options {
    display: flex;
    gap: 15px;
    margin-top: 18px;
}

.options select {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #11152b;
    color: white;
    font-family: inherit;
    outline: none;
}

.generate-btn {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 14px;

    background:
        linear-gradient(
            90deg,
            #6c4cff,
            #9b5cff
        );

    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;

    box-shadow:
        0 10px 30px rgba(108,76,255,0.3);
}

.generate-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 40px rgba(108,76,255,0.5);
}

.generate-btn:disabled {
    opacity: 0.6;
    cursor: wait;
}

#result {
    margin-top: 30px;
}

#result img {
    width: 100%;
    max-width: 768px;
    border-radius: 18px;
    display: block;
    margin: auto;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5);
}

.result-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
}

.result-buttons a {
    padding: 12px 20px;
    border-radius: 10px;
    color: white;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
    text-decoration: none;
}

.status {
    margin-top: 15px;
    color: #aaaec4;
}

.error {
    color: #ff7777;
}

.success {
    color: #7dff9b;
}

.usage {
    margin-top: 12px;
    color: #888da5;
    font-size: 13px;
}

@media (max-width: 600px) {

    .samai-title {
        font-size: 42px;
    }

    .samai-subtitle {
        font-size: 16px;
    }

    .generator {
        padding: 20px;
    }

    .options {
        flex-direction: column;
    }

    .samai-nav {
        padding: 0 20px;
    }

}

</style>
</head>

<body>

<nav class="samai-nav">

    <div class="samai-brand">
        ✨ SamAI
    </div>

    <a href="index.html" class="back-btn">
        ← VocalVista
    </a>

</nav>

<main class="samai-hero">

    <div class="samai-glow"></div>

    <h1 class="samai-title">
        ✨ SamAI
    </h1>

    <p class="samai-subtitle">
        Imagine. Create.
    </p>

    <div class="generator">

        <textarea
            id="prompt"
            placeholder="Describe the image you want to create..."
        ></textarea>

        <div class="options">

            <select id="style">

                <option value="realistic">
                    Realistic
                </option>

                <option value="anime">
                    Anime
                </option>

                <option value="cinematic">
                    Cinematic
                </option>

                <option value="3d">
                    3D
                </option>

                <option value="digital-art">
                    Digital Art
                </option>

            </select>

            <select id="size">

                <option value="square">
                    Square
                </option>

                <option value="portrait">
                    Portrait
                </option>

                <option value="landscape">
                    Landscape
                </option>

            </select>

        </div>

        <button
            class="generate-btn"
            id="generateBtn"
            onclick="generateImage()"
        >
            ✨ Generate Image
        </button>

        <div id="status" class="status"></div>

        <div id="usage" class="usage"></div>

        <div id="result"></div>

    </div>

</main>


<script>

/* =====================================================
   SAMAI CLOUDFLARE WORKER
   ===================================================== */

const WORKER_URL =
    "https://samai-image.vocalvista2012.workers.dev/";


/* =====================================================
   AUTOMATIC USER ID
   ===================================================== */

function createUserId() {

    if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ) {

        return window.crypto.randomUUID();

    }

    return (
        "samai-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 10)
    );

}


let userId =
    localStorage.getItem("samai_user_id");


if (!userId) {

    userId =
        createUserId();

    localStorage.setItem(
        "samai_user_id",
        userId
    );

}


console.log(
    "SamAI User ID:",
    userId
);


/* =====================================================
   GENERATE IMAGE
   ===================================================== */

async function generateImage() {

    const promptInput =
        document.getElementById("prompt");

    const style =
        document.getElementById("style").value;

    const size =
        document.getElementById("size").value;

    const button =
        document.getElementById("generateBtn");

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    const usage =
        document.getElementById("usage");


    let prompt =
        promptInput.value.trim();


    /* -------------------------------------------------
       Check prompt
       ------------------------------------------------- */

    if (!prompt) {

        status.className =
            "status error";

        status.textContent =
            "Please describe the image you want to create.";

        return;

    }


    /* -------------------------------------------------
       Add style
       ------------------------------------------------- */

    prompt =
        `${style} style, ${prompt}`;


    /* -------------------------------------------------
       Add size
       ------------------------------------------------- */

    if (size === "square") {

        prompt +=
            ", square composition, 1:1 aspect ratio";

    }

    else if (size === "portrait") {

        prompt +=
            ", portrait composition, vertical format";

    }

    else if (size === "landscape") {

        prompt +=
            ", landscape composition, horizontal format";

    }


    /* -------------------------------------------------
       Loading
       ------------------------------------------------- */

    button.disabled =
        true;

    button.innerHTML =
        "⏳ Creating your image...";

    result.innerHTML = "";

    usage.textContent = "";

    status.className =
        "status";

    status.textContent =
        "✨ SamAI is creating your image...";


    try {

        /* ---------------------------------------------
           SEND POST REQUEST
           --------------------------------------------- */

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        prompt:
                            prompt,

                        userId:
                            userId

                    })

                }
            );


        /* ---------------------------------------------
           Read response
           --------------------------------------------- */

        const data =
            await response.json();


        /* ---------------------------------------------
           Error
           --------------------------------------------- */

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Image generation failed."
            );

        }


        /* ---------------------------------------------
           Check image
           --------------------------------------------- */

        if (!data.image) {

            throw new Error(
                "The server did not return an image."
            );

        }


        /* ---------------------------------------------
           Show image
           --------------------------------------------- */

        result.innerHTML = `

            <img
                src="${data.image}"
                alt="SamAI generated image"
            >

            <div class="result-buttons">

                <a
                    href="${data.image}"
                    download="SamAI-image.jpg"
                >
                    ⬇ Download Image
                </a>

            </div>

        `;


        /* ---------------------------------------------
           Usage
           --------------------------------------------- */

        if (
            data.remaining !== undefined &&
            data.limit !== undefined
        ) {

            usage.textContent =
                `${data.remaining} of ${data.limit} generations remaining today`;

        }


        /* ---------------------------------------------
           Success
           --------------------------------------------- */

        status.className =
            "status success";

        status.textContent =
            "✨ Image created successfully!";


    }

    catch (error) {

        console.error(
            "SamAI Error:",
            error
        );

        status.className =
            "status error";

        status.textContent =
            "❌ " +
            (
                error.message ||
                "Something went wrong."
            );

    }


    /* -------------------------------------------------
       Restore button
       ------------------------------------------------- */

    button.disabled =
        false;

    button.innerHTML =
        "✨ Generate Image";

}

</script>
<section class="ai-tools">
  <h2>🤖 AI Tools</h2>

  <div class="tool-card">
    <div class="tool-icon">🎬</div>
    <h3>Luke AI</h3>
    <p>Generate videos from your ideas.</p>
    <button onclick="openLukeAI()">Try Luke AI</button>
  </div>
</section>
 <div id="lukeAI" class="luke-container" style="display:none;">
  <button onclick="closeLukeAI()">← Back</button>

  <h1>🎬 Luke AI</h1>
  <p>Turn your ideas into videos.</p>

  <textarea
    id="videoPrompt"
    placeholder="Describe the video you want..."
  ></textarea>

  <button onclick="generateVideo()">
    ✨ Generate Video
  </button>

  <div id="videoStatus"></div>

  <video
    id="videoPreview"
    controls
    style="display:none; width:100%;"
  ></video>
</div>   
</body>
</html>
