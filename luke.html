<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luke AI | SamAI</title>

<meta name="description"
      content="Luke AI - AI Video Generator by SamAI and VocalVista.">

<link rel="icon" href="icon-192.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Poppins", sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #21104d 0%, #090812 45%, #030308 100%);
    color: white;
}

/* NAVBAR */

.navbar {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 800;
}

.logo span {
    background: linear-gradient(90deg, #ffffff, #a855f7, #4cc9ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.back-btn {
    text-decoration: none;
    color: white;
    padding: 10px 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    transition: 0.3s;
}

.back-btn:hover {
    background: rgba(255,255,255,0.12);
}

/* MAIN */

.container {
    width: min(900px, 92%);
    margin: 60px auto;
}

.hero {
    text-align: center;
    margin-bottom: 35px;
}

.luke-icon {
    font-size: 65px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 20px #8b5cf6);
}

h1 {
    font-size: clamp(38px, 7vw, 65px);
    font-weight: 800;
    background: linear-gradient(
        90deg,
        #ffffff,
        #a855f7,
        #4cc9ff
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    color: #bdbbd0;
    margin-top: 10px;
}

/* GENERATOR BOX */

.generator {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 70px rgba(0,0,0,0.35);
}

label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
}

textarea {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    outline: none;
    background: rgba(0,0,0,0.3);
    color: white;
    font-family: inherit;
    font-size: 15px;
}

textarea::placeholder {
    color: #858396;
}

textarea:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 20px rgba(139,92,246,0.2);
}

/* OPTIONS */

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.option {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

select {
    padding: 13px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #11101a;
    color: white;
    font-family: inherit;
    outline: none;
}

/* BUTTON */

.generate-btn {
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: linear-gradient(90deg, #7c3aed, #4c9cff);
    box-shadow: 0 10px 30px rgba(124,58,237,0.3);
    transition: 0.3s;
}

.generate-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(124,58,237,0.45);
}

.generate-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* STATUS */

.status {
    text-align: center;
    margin-top: 22px;
    color: #bdbbd0;
    min-height: 25px;
}

/* VIDEO */

.video-result {
    display: none;
    margin-top: 30px;
}

.video-result video {
    width: 100%;
    border-radius: 18px;
    background: black;
    border: 1px solid rgba(255,255,255,0.1);
}

.download-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    color: white;
    text-decoration: none;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 40px 20px;
    color: #777487;
    font-size: 13px;
}

/* MOBILE */

@media (max-width: 600px) {

    .navbar {
        padding: 0 5%;
    }

    .container {
        margin-top: 35px;
    }

    .generator {
        padding: 20px;
    }

    .options {
        grid-template-columns: 1fr;
    }

    .back-btn {
        padding: 8px 12px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🎬 <span>Luke AI</span>
    </div>

    <a href="samai.html" class="back-btn">
        ← Back to SamAI
    </a>

</nav>


<!-- MAIN -->

<main class="container">

    <div class="hero">

        <div class="luke-icon">
            🎬
        </div>

        <h1>Luke AI</h1>

        <p>
            Turn your ideas into amazing AI-generated videos.
        </p>

    </div>


    <!-- GENERATOR -->

    <section class="generator">

        <label for="videoPrompt">
            Describe your video
        </label>

        <textarea
            id="videoPrompt"
            placeholder="Example: A futuristic city at night with flying cars, cinematic lighting..."
        ></textarea>


        <div class="options">

            <div class="option">

                <label for="videoStyle">
                    Style
                </label>

                <select id="videoStyle">

                    <option value="cinematic">
                        🎬 Cinematic
                    </option>

                    <option value="realistic">
                        📷 Realistic
                    </option>

                    <option value="anime">
                        🌸 Anime
                    </option>

                    <option value="3d">
                        🧊 3D
                    </option>

                    <option value="cartoon">
                        🎨 Cartoon
                    </option>

                </select>

            </div>


            <div class="option">

                <label for="videoRatio">
                    Aspect Ratio
                </label>

                <select id="videoRatio">

                    <option value="16:9">
                        16:9
                    </option>

                    <option value="9:16">
                        9:16
                    </option>

                    <option value="1:1">
                        1:1
                    </option>

                </select>

            </div>

        </div>


        <button
            class="generate-btn"
            id="generateBtn"
            onclick="generateVideo()">

            ✨ Generate Video

        </button>


        <div
            class="status"
            id="videoStatus">
        </div>


        <div
            class="video-result"
            id="videoResult">

            <video
                id="videoPreview"
                controls>
            </video>

            <br>

            <a
                id="downloadBtn"
                class="download-btn"
                download="luke-ai-video.mp4">

                ⬇️ Download Video

            </a>

        </div>

    </section>

</main>


<footer>

    <p>
        Luke AI • Powered by SamAI • VocalVista
    </p>

</footer>


<script>

async function generateVideo() {

    const prompt =
        document.getElementById("videoPrompt").value.trim();

    const style =
        document.getElementById("videoStyle").value;

    const ratio =
        document.getElementById("videoRatio").value;

    const status =
        document.getElementById("videoStatus");

    const button =
        document.getElementById("generateBtn");


    if (!prompt) {

        status.textContent =
            "⚠️ Please describe the video you want.";

        return;
    }


    button.disabled = true;

    button.textContent =
        "⏳ Generating...";

    status.textContent =
        "🎬 Luke AI is preparing your video...";


    try {

        /*
         * YOUR CLOUDFLARE WORKER WILL GO HERE.
         *
         * Example:
         *
         * const response = await fetch(
         *     "https://YOUR-WORKER.workers.dev/generate-video",
         *     {
         *         method: "POST",
         *         headers: {
         *             "Content-Type": "application/json"
         *         },
         *         body: JSON.stringify({
         *             prompt: prompt,
         *             style: style,
         *             ratio: ratio
         *         })
         *     }
         * );
         *
         * const data = await response.json();
         */


        // TEMPORARY MESSAGE
        // Remove this when we connect the real API.

        await new Promise(resolve =>
            setTimeout(resolve, 1500)
        );

        status.textContent =
            "⚠️ Luke AI is ready, but the video API has not been connected yet.";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "❌ Something went wrong.";

    }

    finally {

        button.disabled = false;

        button.textContent =
            "✨ Generate Video";

    }

}

</script>

</body>
</html>
